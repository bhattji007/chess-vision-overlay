<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 12px 14px; font: 13px system-ui, sans-serif; background: #17191d; color: #e6e6e6; }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 7px 0; }
  .row label { flex: 1; }
  select, button, input[type=range] { font: inherit; }
  select { background: #23262c; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 3px 6px; }
  button { background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button.secondary { background: #2b2f36; }
  button:disabled { opacity: .5; cursor: default; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .btns .wide { grid-column: 1 / -1; }
  #status { margin-top: 10px; padding: 8px; background: #101215; border-radius: 6px; min-height: 34px; color: #bcd; line-height: 1.35; white-space: pre-wrap; }
  #status.err { color: #ff8a8a; }
  .legend { display: flex; gap: 10px; font-size: 11px; color: #9aa; margin-top: 6px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 3px; }
  input[type=color] { width: 26px; height: 22px; border: 0; background: none; padding: 0; }
  hr { border: 0; border-top: 1px solid #2a2d33; margin: 10px 0; }
  .switch { width: 36px; height: 20px; }
</style></head>
<body>
  <h1>Chess Vision Overlay <input type="checkbox" id="enabled" class="switch" title="Enable overlay"></h1>

  <div class="row"><label>Read pieces from</label>
    <select id="source"><option value="visual">Screenshot (visual)</option><option value="dom">Page DOM (chess.com / lichess)</option></select></div>
  <div class="row"><label>I am playing</label>
    <select id="myColor"><option value="auto">Auto (side at bottom)</option><option value="w">White</option><option value="b">Black</option></select></div>

  <hr>
  <div class="row"><label><input type="checkbox" id="showMine"> My moves</label><input type="color" id="mineColor"></div>
  <div class="row"><label><input type="checkbox" id="showTheirs"> Opponent's moves</label><input type="color" id="theirsColor"></div>
  <div class="row"><label><input type="checkbox" id="showDanger"> Hanging / attacked piece rings</label></div>
  <div class="row"><label>Line opacity</label><input type="range" id="opacity" min="0.05" max="1" step="0.05" style="width:130px"></div>
  <div class="legend">
    <span><span class="sw" style="background:#ff3c3c"></span>your piece is hanging</span>
    <span><span class="sw" style="background:#ffa028"></span>attacked, defended</span>
    <span><span class="sw" style="background:#3cdc6e"></span>free capture</span>
  </div>

  <hr>
  <div class="btns">
    <button id="calibrate" class="wide" title="Board must show the standard starting position">Calibrate from starting position</button>
    <button id="selectRegion" class="secondary">Select board region</button>
    <button id="clearRegion" class="secondary">Auto-detect board</button>
    <button id="clearCal" class="secondary wide">Forget templates for this site</button>
    <button id="activate" class="wide" style="display:none">Activate on this page</button>
  </div>
  <div id="status">Connecting…</div>
  <script src="popup.js"></script>
</body></html>
